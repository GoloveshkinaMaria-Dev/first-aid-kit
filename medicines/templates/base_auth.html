<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}First Aid Kit{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; padding-top: 40px; padding-bottom: 40px; }
        .form-auth { width: 100%; max-width: 400px; padding: 15px; margin: auto; }
    </style>
</head>
<body>
    <main class="form-auth">
        <div class="text-center mb-4">
            <h1 class="h3 mb-3 fw-normal">🏥 First Aid Kit</h1>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
