{% extends "base_auth.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
    <h4 class="mb-3 text-center">Создание аккаунта</h4>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" required>
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-success w-100 mt-3">Зарегистрироваться</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none">Уже есть аккаунт? Войти</a>
    </div>
{% endblock %}
